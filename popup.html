<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <span class="icon">👋</span>
        <h2>Hello World</h2>
      </header>

      <section class="card">
        <div class="stat-group">
          <span class="stat-label">Greetings Sent</span>
          <span id="greeting-count" class="stat-value">0</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">Status</span>
          <span id="status-message" class="stat-value">Active</span>
        </div>
      </section>

      <footer>
        <button id="reset-btn">Reset Stats</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
