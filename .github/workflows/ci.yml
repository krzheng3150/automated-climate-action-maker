name: CI & Store Packaging Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-test-package:
    name: Audit, Verify & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Direct Push Authorization
        if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
        run: |
          ALLOWED_ACTOR="krzheng3150"
          if [ "${{ github.actor }}" != "$ALLOWED_ACTOR" ]; then
            echo "::error::Direct pushes to master are restricted to @$ALLOWED_ACTOR. Contributors must submit a Pull Request."
            exit 1
          fi
          echo "Direct push verified: authorized actor @$ALLOWED_ACTOR."

      - name: 1. TypeScript Typecheck
        run: npm run typecheck

      - name: 2. Static Security & Manifest Audit
        run: npm run check:static

      - name: 3. Storage Versioning & Migration Suite
        run: npm run test:migration

      - name: 4. Runtime Security Guardrails (Puppeteer)
        run: npm run check:runtime

      - name: 5. End-to-End Regression Suite
        run: npm run test:e2e

      - name: 6. Build Chrome Web Store Package
        run: npm run pack:store

      - name: 7. Upload Production Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acam-chrome-extension-package
          path: acam-v*.zip
          retention-days: 14
          if-no-files-found: error
